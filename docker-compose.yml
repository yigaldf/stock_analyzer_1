services:
  stock-analyzer:
    build: .
    image: stock-analyzer:local
    ports:
      - "7860:7860"
    env_file:
      - .env
    volumes:
      - metrics-cache:/app/.cache/metrics
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  metrics-cache:
